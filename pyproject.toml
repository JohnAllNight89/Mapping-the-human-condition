[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "blueprint-calculator"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pyswisseph>=2.10,<3",
    "timezonefinder>=8,<9",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
blueprint-calculator = "blueprint_calculator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["blueprint_calculator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
